name: Regenerate translations once

# Temporary workflow: generate tracked i18n assets using the project's own
# script, commit them on this PR branch, then remove this workflow.
on:
  push:
    branches: [chore/ci-cd-versioned-releases]
    paths: [.github/workflows/regenerate-i18n-once.yml]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'zce/make-slack-great-again'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Refresh tracked translations and retire this helper
        run: |
          set -euo pipefail
          python3 src/tools/i18n.py update
          python3 src/tools/i18n.py check
          rm .github/workflows/regenerate-i18n-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/i18n/ja.po src/app/i18n/languages_generated.cpp
          git add -u .github/workflows/regenerate-i18n-once.yml
          git diff --cached --stat
          git commit -m "fix(i18n): regenerate locale catalog and compiled table"
          git push origin HEAD:refs/heads/chore/ci-cd-versioned-releases
