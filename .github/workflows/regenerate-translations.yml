# One-shot maintenance workflow for this feature branch only.
# Regenerates upstream's committed translation assets without changing CI policy.
name: Regenerate translations (temporary)
on:
  push:
    branches:
      - feat/remove-claude
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'zce/make-slack-great-again'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate committed translations
        run: python3 src/tools/i18n.py update
      - name: Commit generated outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/i18n/*.po src/app/i18n/languages_generated.cpp
          if git diff --cached --quiet; then
            echo "Translations already up to date"
            exit 0
          fi
          git commit -m "chore(i18n): regenerate translations for Slack-only fork"
          git push origin HEAD:refs/heads/feat/remove-claude
