# Temporary one-shot catalog refresh for PR #4; remove after it commits generated files.
name: Refresh PR4 translations
on:
  push:
    branches: [feat/activity-bar-profile]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate catalog and commit if changed
        run: |
          set -euo pipefail
          python3 src/tools/i18n.py update
          git add src/app/i18n/ja.po src/app/i18n/languages_generated.cpp
          if git diff --cached --quiet; then
            echo "Translations already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(i18n): update generated catalogs after title-bar cleanup"
          git push origin HEAD:feat/activity-bar-profile
