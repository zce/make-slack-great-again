name: Regenerate translations (one-off)

on:
  push:
    branches:
      - 'refactor/settings-information-architecture'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'refactor/settings-information-architecture'
      - name: Regenerate translation catalog
        run: python3 src/tools/i18n.py update
      - name: Commit generated catalog and remove this workflow
        run: |
          rm .github/workflows/update-translations-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(i18n): regenerate translation catalog"
          git push origin HEAD:refactor/settings-information-architecture
