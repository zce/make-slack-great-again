name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-mbedtls:
    name: Prepare pinned Mbed TLS source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned Mbed TLS source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/fetchcontent
          key: mbedtls-${{ hashFiles('src/net/posix/posix.cmake') }}
      - name: Download and verify Mbed TLS source
        run: scripts/prepare-mbedtls.sh

  linux:
    needs: prepare-mbedtls
    name: ${{ matrix.runner }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the PR binary compatible with Ubuntu 24.04's glibc/runtime.
          - runner: ubuntu-24.04
            compiler: gcc
            artifact: true
          # Keep the OS baseline fixed so GCC/Clang differences are isolated.
          - runner: ubuntu-24.04
            compiler: clang
            artifact: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 600M
      MSGA_MBEDTLS_SOURCE_DIR: ${{ github.workspace }}/.ci-cache/fetchcontent/msga_mbedtls-src
      # Run demo tests in the same build tree on GCC PR validation only.
      MSGA_DEMO: ${{ github.event_name == 'pull_request' && matrix.compiler == 'gcc' }}
      # GCC uses ordinary TUs for ccache reuse; Clang keeps exercising PCH.
      MSGA_PCH: ${{ matrix.compiler == 'gcc' && 'OFF' || 'AUTO' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned Mbed TLS source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/fetchcontent
          key: mbedtls-${{ hashFiles('src/net/posix/posix.cmake') }}
      - name: Install build dependencies
        id: dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 ccache jq \
            libfreetype-dev libharfbuzz-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-xkb-dev libxcb-shm0-dev \
            libxcb-randr0-dev libxcb-cursor-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xtest0-dev libdbus-1-dev \
            fonts-inter fonts-noto-color-emoji
      - name: Cache compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.runner }}-${{ matrix.compiler }}-v2-${{ github.sha }}
          restore-keys: ccache-${{ matrix.runner }}-${{ matrix.compiler }}-v2-
      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DMSGA_BUILD_TESTS=ON \
            -DMSGA_DEMO=${MSGA_DEMO} \
            -DMSGA_PCH=${MSGA_PCH} \
            -DMSGA_SELF_UPDATE=OFF \
            -DFETCHCONTENT_SOURCE_DIR_MSGA_MBEDTLS="${MSGA_MBEDTLS_SOURCE_DIR}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Build required CI targets
        run: |
          set -euo pipefail
          # Build the app and every executable CTest runs. Developer galleries
          # and size probes are not part of CI validation.
          targets=(
            msga
            msga_base_tests
            msga_net_tests
            gfx_tests
            text_tests
            ui_tests
            msga_app_tests
          )
          if [[ "${MSGA_DEMO}" == "true" ]]; then
            targets+=(demo_tests)
          fi
          cmake --build build-ci --parallel 4 --target "${targets[@]}"
      - name: Test release provenance guard
        run: bash tests/workflows/test-release-provenance.sh
      # Four workers match the runner's CPU capacity. Test HOME/XDG state is
      # isolated per process; the shell suites use distinct test-home paths.
      # The demo test is registered in this same tree on GCC PR builds only.
      - name: Test
        if: matrix.artifact || github.event_name != 'pull_request'
        timeout-minutes: 15
        run: ctest --test-dir build-ci --output-on-failure --parallel 4

      - name: Show compiler cache statistics
        if: always() && steps.dependencies.outcome == 'success'
        run: ccache --show-stats

      # PR artifacts are test-enabled executables, never release binaries.
      - name: Prepare pull request test build
        if: github.event_name == 'pull_request' && matrix.artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build-ci/msga dist/msga
          chmod +x dist/msga
          (cd dist && sha256sum msga > SHA256SUMS)
      - name: Upload pull request test build
        if: github.event_name == 'pull_request' && matrix.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msga-linux-x86_64-pr${{ github.event.pull_request.number }}
          path: |
            dist/msga
            dist/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      # Make the actual production binary during successful master CI, so
      # publishing can reuse this verified SHA's artifact without compiling again.
      - name: Configure production build
        if: github.event_name == 'push' && matrix.artifact
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DMSGA_BUILD_TESTS=OFF \
            -DMSGA_DEMO=OFF \
            -DMSGA_SELF_UPDATE=OFF \
            -DMSGA_SIZE_MAP=OFF \
            -DFETCHCONTENT_SOURCE_DIR_MSGA_MBEDTLS="${MSGA_MBEDTLS_SOURCE_DIR}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build production binary
        if: github.event_name == 'push' && matrix.artifact
        run: cmake --build build-release --target msga --parallel 4
      - name: Package and checksum
        if: github.event_name == 'push' && matrix.artifact
        run: |
          set -euo pipefail
          mkdir -p release-dist
          strip build-release/msga
          cp build-release/msga release-dist/msga-linux-x86_64
          ldd release-dist/msga-linux-x86_64 | tee release-dist/DEPENDENCIES.txt
          if grep -q 'not found' release-dist/DEPENDENCIES.txt; then
            echo "Missing shared-library dependencies in release binary" >&2
            exit 1
          fi
          (cd release-dist && sha256sum msga-linux-x86_64 > SHA256SUMS)
      - name: Upload production artifact
        if: github.event_name == 'push' && matrix.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msga-linux-x86_64-release
          path: release-dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30


  asan:
    needs: prepare-mbedtls
    name: ASan + LSan / 10-round soak
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MSGA_MBEDTLS_SOURCE_DIR: ${{ github.workspace }}/.ci-cache/fetchcontent/msga_mbedtls-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned Mbed TLS source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/fetchcontent
          key: mbedtls-${{ hashFiles('src/net/posix/posix.cmake') }}

      - name: Install build and display dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 ccache jq \
            libfreetype-dev libharfbuzz-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-xkb-dev libxcb-shm0-dev \
            libxcb-randr0-dev libxcb-cursor-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xtest0-dev libdbus-1-dev \
            fonts-inter fonts-noto-color-emoji \
            xvfb xauth

      - name: Run tests and memory soak under ASan / LSan
        timeout-minutes: 55
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1280x800x24" \
            scripts/run-asan.sh 10 2>&1 | tee artifacts/asan-soak.log

      - name: Upload sanitizer log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-asan-lsan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/asan-soak.log
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows x86_64 / MinGW
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      # MSYS2 tools expect LF in checked-out source files.
      - name: Configure Git line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          # windows-2025 includes MSYS2 at C:\\msys64; reuse it instead of
          # downloading and extracting a fresh base installation each run.
          release: false
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
      # The font libraries are pinned by URL_HASH in font_libs.cmake.
      # Keep their extracted FetchContent sources outside build-release, which
      # the release script deliberately recreates on a clean runner.
      - name: Cache Windows FetchContent sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/fetchcontent
          key: windows-fetchcontent-${{ hashFiles('src/text/font_libs.cmake') }}
      # ccache's compiler identity check protects this rolling MSYS2 toolchain
      # cache when GCC or its dependencies change.
      - name: Cache Windows compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/ccache
          key: windows-ccache-${{ hashFiles('scripts/msys2.ps1', 'src/text/font_libs.cmake') }}-${{ github.sha }}
          restore-keys: |
            windows-ccache-${{ hashFiles('scripts/msys2.ps1', 'src/text/font_libs.cmake') }}-
      - name: Build Windows release executable
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and checksum
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:GITHUB_WORKSPACE 'build-release\msga.exe'
          if (-not (Test-Path $binary -PathType Leaf)) {
            throw "Windows release executable not found: $binary"
          }

          # A release must not depend on DLLs shipped by the MSYS2 toolchain.
          $objdump = Join-Path $env:MSYS2_ROOT 'mingw64\bin\objdump.exe'
          $imports = & $objdump -p $binary
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect Windows executable imports.'
          }
          $runtimeDlls = @($imports | Select-String -Pattern '^\s*DLL Name:\s*(libgcc|libstdc\+\+|libwinpthread|libatomic|libgomp)' -CaseSensitive:$false)
          if ($runtimeDlls.Count -gt 0) {
            $names = ($runtimeDlls | ForEach-Object { $_.Line.Trim() }) -join ', '
            throw "Windows release depends on MinGW runtime DLLs: $names"
          }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'release-dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $asset = 'msga-windows-x86_64.exe'
          $packagedBinary = Join-Path $dist $asset
          Copy-Item $binary $packagedBinary
          $hash = (Get-FileHash -Path $packagedBinary -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $dist 'SHA256SUMS'),
            "$hash  $asset`n",
            [Text.Encoding]::ASCII
          )
      # PR builds are for manual testing; keep them separate from production releases.
      - name: Upload pull request test build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msga-windows-x86_64-pr${{ github.event.pull_request.number }}
          path: release-dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msga-windows-x86_64-release
          path: release-dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
