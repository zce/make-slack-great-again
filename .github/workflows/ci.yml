name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.runner }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the PR binary compatible with Ubuntu 24.04's glibc/runtime.
          - runner: ubuntu-24.04
            compiler: gcc
            artifact: true
          # Compile every PR with Clang; run its full tests on master/manual CI.
          - runner: ubuntu-26.04
            compiler: clang
            artifact: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 600M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 ccache \
            libfreetype-dev libharfbuzz-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-xkb-dev libxcb-shm0-dev \
            libxcb-randr0-dev libxcb-cursor-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xtest0-dev libdbus-1-dev \
            fonts-inter fonts-noto-color-emoji
      - name: Cache compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.runner }}-${{ matrix.compiler }}-v2-${{ github.sha }}
          restore-keys: ccache-${{ matrix.runner }}-${{ matrix.compiler }}-v2-
      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DMSGA_BUILD_TESTS=ON \
            -DMSGA_DEMO=OFF \
            -DMSGA_SELF_UPDATE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build-ci --parallel 4
      # Most CI time is spent running 114 tests serially. Start conservatively
      # at two workers; resource-sharing tests should use CTest RESOURCE_LOCK.
      - name: Test
        if: matrix.artifact || github.event_name != 'pull_request'
        timeout-minutes: 15
        run: ctest --test-dir build-ci --output-on-failure --parallel 2

      # PR artifacts are test-enabled executables, never release binaries.
      - name: Prepare pull request test build
        if: github.event_name == 'pull_request' && matrix.artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build-ci/msga dist/msga
          chmod +x dist/msga
          (cd dist && sha256sum msga > SHA256SUMS)
      - name: Upload pull request test build
        if: github.event_name == 'pull_request' && matrix.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msga-linux-x86_64-pr${{ github.event.pull_request.number }}
          path: |
            dist/msga
            dist/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      # Make the actual production binary during successful master CI, so
      # publishing can reuse this verified SHA's artifact without compiling again.
      - name: Configure production build
        if: github.event_name == 'push' && matrix.artifact
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DMSGA_BUILD_TESTS=OFF \
            -DMSGA_DEMO=OFF \
            -DMSGA_SELF_UPDATE=OFF \
            -DMSGA_SIZE_MAP=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build production binary
        if: github.event_name == 'push' && matrix.artifact
        run: cmake --build build-release --target msga --parallel 4
      - name: Package and checksum
        if: github.event_name == 'push' && matrix.artifact
        run: |
          set -euo pipefail
          mkdir -p release-dist
          strip build-release/msga
          cp build-release/msga release-dist/msga-linux-x86_64
          ldd release-dist/msga-linux-x86_64 | tee release-dist/DEPENDENCIES.txt
          if grep -q 'not found' release-dist/DEPENDENCIES.txt; then
            echo "Missing shared-library dependencies in release binary" >&2
            exit 1
          fi
          (cd release-dist && sha256sum msga-linux-x86_64 > SHA256SUMS)
      - name: Upload production artifact
        if: github.event_name == 'push' && matrix.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msga-linux-x86_64-release
          path: release-dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
