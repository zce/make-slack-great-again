name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        timeout-minutes: 7
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 \
            libfreetype-dev libharfbuzz-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-xkb-dev libxcb-shm0-dev \
            libxcb-randr0-dev libxcb-cursor-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xtest0-dev libdbus-1-dev \
            fonts-inter fonts-noto-color-emoji
      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DMSGA_BUILD_TESTS=ON \
            -DMSGA_DEMO=OFF \
            -DMSGA_SELF_UPDATE=OFF
      - name: Build
        run: cmake --build build-ci --parallel 4
      - name: Verify regression-sensitive tests
        run: ctest --test-dir build-ci --output-on-failure --parallel 1 -R '^(text_ink_lean|ui_popup|messages_actions|shell_ui_tests|settings_tests)$'
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --parallel 2

      - name: Package pull request test build
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build-ci/msga dist/msga
          chmod +x dist/msga
          (cd dist && sha256sum msga > SHA256SUMS)
          tar -C dist -czf dist/msga-linux-x86_64-pr${{ github.event.pull_request.number }}.tar.gz msga SHA256SUMS
      - name: Upload pull request test build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: msga-linux-x86_64-pr${{ github.event.pull_request.number }}
          path: dist/msga-linux-x86_64-pr${{ github.event.pull_request.number }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  preview-release:
    needs: linux
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msga-linux-x86_64-pr${{ github.event.pull_request.number }}
          path: dist
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:12}"
          tag="test-pr${PR_NUMBER}-${short}"
          gh release create "$tag" dist/*.tar.gz \
            --target "$HEAD_SHA" \
            --title "MSGA PR #${PR_NUMBER} test build (${short})" \
            --notes "Unmerged test build for PR #${PR_NUMBER}. Linux x86_64 (Ubuntu 24.04 dynamic binary). SHA256SUMS is inside the archive. Not a stable production release." \
            --prerelease
