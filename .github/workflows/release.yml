name: Release

# Public releases are intentional, not a side-effect of every merge.
# Only an artifact from a successful push-to-master CI run of this exact
# commit can be published. Never use the upstream msga.app updater.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version, e.g. 0.1.0 or 0.2.0-rc.1 (without v)'
        required: true
        type: string
      ci_run_id:
        description: 'Optional master CI run ID to wait for (defaults to this commit)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-master
  cancel-in-progress: false

run-name: Release v${{ inputs.version }}

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate version and CI provenance
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORK_VERSION: ${{ inputs.version }}
          REQUESTED_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$FORK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "Expected a fork SemVer such as 0.1.0 or 0.2.0-rc.1" >&2
            exit 1
          fi

          tag="v${FORK_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1 ||
             gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          # The release button can be clicked immediately after a push. The
          # corresponding CI run may not have been registered yet, or may still
          # be running. Wait for that exact master push instead of racing it.
          run_id="$REQUESTED_RUN_ID"
          if [[ -n "$run_id" && ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "ci_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          fi

          max_attempts=80
          poll_interval=15
          ci_status=""
          ci_conclusion=""

          for attempt in $(seq 1 "$max_attempts"); do
            if [[ -z "$run_id" ]]; then
              runs_json="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs" \
                -f branch=master -f event=push -F per_page=50)"
              run_id="$(jq -r --arg sha "$GITHUB_SHA" '
                [.workflow_runs[]
                  | select(.head_sha == $sha and .head_branch == "master" and .event == "push")]
                | sort_by(.created_at) | last | .id // empty
              ' <<< "$runs_json")"
            fi

            if [[ -z "$run_id" ]]; then
              echo "[$attempt/$max_attempts] Waiting for the master CI run for $GITHUB_SHA to appear..."
            else
              run_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}")"
              jq -e --arg sha "$GITHUB_SHA" --arg repo "$GH_REPO" '
                .name == "CI" and
                .event == "push" and
                .head_branch == "master" and
                .head_sha == $sha and
                .head_repository.full_name == $repo
              ' <<< "$run_json" >/dev/null || {
                echo "CI run $run_id is not the master push for this exact commit" >&2
                exit 1
              }

              ci_status="$(jq -r '.status' <<< "$run_json")"
              ci_conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"

              if [[ "$ci_status" == "completed" ]]; then
                if [[ "$ci_conclusion" != "success" ]]; then
                  echo "Master CI run $run_id completed with conclusion: $ci_conclusion" >&2
                  exit 1
                fi
                break
              fi

              echo "[$attempt/$max_attempts] Master CI run $run_id is $ci_status; waiting..."
            fi

            if (( attempt < max_attempts )); then
              sleep "$poll_interval"
            fi
          done

          if [[ "$ci_status" != "completed" || "$ci_conclusion" != "success" ]]; then
            echo "Timed out waiting for successful master CI for $GITHUB_SHA (waited up to 20 minutes)" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Verified successful CI run $run_id for $GITHUB_SHA"

      - name: Download Linux production binary from validated CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msga-linux-x86_64-release
          path: dist/linux
          run-id: ${{ steps.verify.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Windows production binary from validated CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msga-windows-x86_64-release
          path: dist/windows
          run-id: ${{ steps.verify.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify checksums
        run: |
          set -euo pipefail
          (cd dist/linux && sha256sum --check SHA256SUMS)
          (cd dist/windows && sha256sum --check SHA256SUMS)
          test -s dist/linux/msga-linux-x86_64
          test -s dist/linux/DEPENDENCIES.txt
          test -s dist/windows/msga-windows-x86_64.exe
          cp dist/linux/msga-linux-x86_64 dist/msga-linux-x86_64
          cp dist/windows/msga-windows-x86_64.exe dist/msga-windows-x86_64.exe
          (cd dist && sha256sum msga-linux-x86_64 msga-windows-x86_64.exe > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          rm dist/linux/SHA256SUMS dist/windows/SHA256SUMS
          chmod +x dist/msga-linux-x86_64

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.verify.outputs.tag }}
          CI_RUN_ID: ${{ steps.verify.outputs.run_id }}
        run: |
          set -euo pipefail
          notes="Verified fork builds from master (commit \`${GITHUB_SHA}\`, CI run ${CI_RUN_ID}). Assets: Linux x86_64 dynamically linked binary and Windows x86_64 statically linked MinGW executable. Upstream in-app updater disabled. See README.md for platform and runtime guidance; the Linux dependency list is attached as DEPENDENCIES.txt."
          assets=(
            dist/SHA256SUMS
            dist/linux/DEPENDENCIES.txt
            dist/msga-linux-x86_64
            dist/msga-windows-x86_64.exe
          )
          if [[ "$TAG" == *-rc.* ]]; then
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "MSGA $TAG" \
              --notes "$notes" \
              --prerelease --latest=false
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "MSGA $TAG" \
              --notes "$notes" \
              --latest
          fi
