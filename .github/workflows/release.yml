name: Release

# Public releases are intentional, not a side-effect of every merge.
# Only an artifact from a successful push-to-master CI run of this exact
# commit can be published. Never use the upstream msga.app updater.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version, e.g. 0.1.0 or 0.2.0-rc.1 (without v)'
        required: true
        type: string
      ci_run_id:
        description: 'Optional successful master CI run ID (defaults to this commit)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-master
  cancel-in-progress: false

run-name: Release v${{ inputs.version }}

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate version and CI provenance
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORK_VERSION: ${{ inputs.version }}
          REQUESTED_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$FORK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "Expected a fork SemVer such as 0.1.0 or 0.2.0-rc.1" >&2
            exit 1
          fi

          tag="v${FORK_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1 ||
             gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          run_id="$REQUESTED_RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=50" |
              jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | first | .id // empty')"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful master CI for this commit; run CI first and optionally supply ci_run_id" >&2
            exit 1
          fi

          gh api "repos/${GH_REPO}/actions/runs/${run_id}" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GH_REPO" '
              .name == "CI" and
              .event == "push" and
              .head_branch == "master" and
              .status == "completed" and
              .conclusion == "success" and
              .head_sha == $sha and
              .head_repository.full_name == $repo' >/dev/null || {
                echo "CI run is not a successful master push for this exact commit" >&2
                exit 1
              }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Verified CI run $run_id for $GITHUB_SHA"

      - name: Download production binary from validated CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msga-linux-x86_64-release
          path: dist
          run-id: ${{ steps.verify.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          test -s dist/msga-linux-x86_64
          test -s dist/DEPENDENCIES.txt
          chmod +x dist/msga-linux-x86_64

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.verify.outputs.tag }}
          CI_RUN_ID: ${{ steps.verify.outputs.run_id }}
        run: |
          set -euo pipefail
          notes="Verified fork build from master (commit \`${GITHUB_SHA}\`, CI run ${CI_RUN_ID}). Linux x86_64 dynamically linked binary; upstream in-app updater disabled. See docs/FORK.md for dependencies."
          if [[ "$TAG" == *-rc.* ]]; then
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "MSGA $TAG" \
              --notes "$notes" \
              --prerelease --latest=false
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "MSGA $TAG" \
              --notes "$notes" \
              --latest
          fi
