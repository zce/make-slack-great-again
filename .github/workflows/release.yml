name: Release

# A successful master CI run is required before publishing.
# The upstream updater must NEVER be enabled in this fork: it downloads
# official msga.app binaries, which would replace our custom version.
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  linux:
    timeout-minutes: 40
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 \
            libfreetype-dev libharfbuzz-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-xkb-dev libxcb-shm0-dev \
            libxcb-randr0-dev libxcb-cursor-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libdbus-1-dev
      - name: Configure release
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DMSGA_BUILD_TESTS=OFF \
            -DMSGA_DEMO=OFF \
            -DMSGA_SELF_UPDATE=OFF \
            -DMSGA_SIZE_MAP=OFF
      - name: Build release binary
        run: cmake --build build-release --target msga --parallel 4
      - name: Package and checksum
        run: |
          mkdir -p dist
          strip build-release/msga
          cp build-release/msga dist/msga-linux-x86_64
          (cd dist && sha256sum msga-linux-x86_64 > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          upstream_version="$(sed -nE 's/^[[:space:]]*set\(MSGA_VERSION[[:space:]]+([0-9]+)\).*/\1/p' version.cmake | head -n1)"
          test -n "$upstream_version"
          tag="v${upstream_version}-zce.${{ github.event.workflow_run.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "msga ${upstream_version} (zce build ${GITHUB_RUN_NUMBER})" \
              --notes "Automated fork build from \`master\` (commit \`${{ github.event.workflow_run.head_sha }}\`). Linux x86_64 dynamic binary; upstream in-app updater disabled. See docs/FORK.md for dependencies and supported platforms."
          fi
